name: pg_solver_db

services:
  pg:
    container_name: pg_solver_db
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: solver
      POSTGRES_PASSWORD: solver
      POSTGRES_DB: solver_sandbox
    ports:
      - "5433:5432"
    volumes:
      - pg_solver_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solver -d solver_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    container_name: pg_solver_qdrant
    image: docker.io/qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - pg_solver_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_solver_data:
    name: pg_solver_data
  pg_solver_qdrant_data:
    name: pg_solver_qdrant_data

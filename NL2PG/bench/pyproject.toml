[project]
name = "bench"
version = "0.2.0"
description = "Synthetic SQL & Natural Language Benchmark Generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlglot>=30.17.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "langgraph>=1.2.11",
    "psycopg-pool>=3.3.1",
    "sqlalchemy>=2.0.52",
    "ormguard>=0.2.0",
    "litellm>=1.96.2",
    "json-repair>=0.63.2",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "orjson>=3.12.0",
    "dateparser>=1.4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[project.scripts]
bench = "bench.adapters.inbound.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.ruff]
line-length = 100
exclude = ["config/"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "BLE",
    "SLF",
    "D",
    "B",
    "SIM",
    "PIE",
    "RET",
    "ARG",
    "PL",
    "RUF",
    "A",
    "C90",
]
ignore = [
    "D203",  # 1 blank line required before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D213",  # Multi-line docstring summary should start at the second line
    "D401",  # First line of docstring should be in imperative mood
    "D105",  # Missing docstring in magic method
    "PLR0913", # Too many arguments in function definition (Composition Root DI)
    "PLR0917", # Too many positional arguments
    "PLW0108", # Lambda unnecessarily wrapping function call
]

[tool.ruff.lint.per-file-ignores]
"src/bench/adapters/inbound/cli/app.py" = ["BLE001"]

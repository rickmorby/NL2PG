[run]
db_dsn   = "postgresql://bench:bench@127.0.0.1:5432/bench_sandbox"
meta_dsn = "postgresql://bench:bench@127.0.0.1:5432/bench_meta"

[cli]
max_consecutive_failures = 5
category_failure_warning = 5

[thresholds]
critic_high = 6.0

[retry]
max_per_node = 3

[orchestrator]
recursion_limit = 150

[hardening]
max_rounds = 3

[calibration]
runs        = 2
temperature = 0.9

[judge]
max_regens = 2

[critic]
weights = { narrative = 1.0, distractors = 1.0, plot_twists = 1.0, jargon = 1.0, sql_composition = 1.5 }

[data]
nature_ranges = { lookup = [5, 50], dimension = [100, 800], fact = [300, 3000] }
max_rows_per_table = 3000
max_total_rows = 30000
batch_size = 100
null_rate = 0.05
dup_rate = 0.03
outlier_rate = 0.02
preview_size = 8
